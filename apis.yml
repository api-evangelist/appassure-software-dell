name: AppAssure Software (Dell)
description: 'AppAssure Software was a data-protection vendor (backup, replication, and recovery for
  physical, virtual, and cloud systems) funded by Bain Capital Ventures before Dell acquired it in 2012.
  Its flagship AppAssure 5 platform shipped a bundled service-management REST API for programmatically
  driving backup, replication, and recovery from the Management Console. The product line has since been
  retired and folded into what is now Quest Rapid Recovery; there is no active public developer portal,
  hosted API host, or machine-readable specification. This profile is retained for network completeness
  and lineage rather than as a live, integrable API surface.'
